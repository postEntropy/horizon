id = "cobblefordays"
name = "Cobble For Days"
version = "1.5.1+mc1.18.2"
description = "Five configurable cobblestone generators with buffered production and item automation."
authors = ["LexManos"]
api = "0.4"
side = "both"
capabilities = ["registries", "block-entities", "item-transfer", "machine-slot-limits", "chat", "server", "storage", "config"]
ported-from = "Cobble For Days 1.5.1; LGPL-2.1-only"

[config.tier1_delay]
type = "int"
default = 40
min = 1
max = 1000000
description = "Tier 1 interval in ticks; kept as an alias for existing Horizon port settings."

[config.tier1_count]
type = "int"
default = 1
min = 1
max = 2147483647
description = "Items generated each Tier 1 update."

[config.tier1_max]
type = "int"
default = 64
min = 1
max = 2147483647
description = "Maximum items held internally by Tier 1."

[config.tier1_pushes]
type = "bool"
default = true
description = "Automatically push Tier 1 output into the inventory above."

